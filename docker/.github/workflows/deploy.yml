name: Deploy to AWS EC2 with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "GitHub Actions"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image to Docker Hub
        run: |
          docker build -t usmanali0805/dockerpractiseimage .
          docker push usmanali0805/dockerpractiseimage

      - name: Set up SSH key for EC2 access
        run: |
          cat > private-key.pem << 'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF

      - name: Set EC2 permissions for SSH key
        run: chmod 600 private-key.pem

      - name: Deploy Docker image to EC2
        run: |
          ssh -i private-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            sudo docker pull usmanali0805/dockerpractiseimage
            sudo docker stop mycontainer || true
            sudo docker rm mycontainer || true
            sudo docker run -d --name mycontainer -p 80:3000 -e PORT=3000 usmanali0805/dockerpractiseimage
          EOF